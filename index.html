<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Gully Runner: Bhaago Beta!</title>
    <meta name="description" content="Sprint through bustling Indian bazaar streets while dodging auto-rickshaws and escaping an angry neighborhood Uncle waving his chappal!" />
    <meta property="og:title" content="Gully Runner: Bhaago Beta!" />
    <meta property="og:description" content="Sprint through bustling Indian bazaar streets while dodging auto-rickshaws and escaping an angry neighborhood Uncle waving his chappal!" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #2a120a;
        font-family: 'Plus Jakarta Sans', sans-serif;
        touch-action: none; /* Prevent pull-to-refresh on mobile */
      }
      .font-cyber {
        font-family: 'Bricolage Grotesque', sans-serif;
      }
      @keyframes chai-hud-pulse {
        0%, 100% {
          transform: scale(1);
          background: linear-gradient(135deg, #f59e0b 0%, #ea580c 52%, #b45309 100%);
          box-shadow: 0 0 18px rgba(245, 158, 11, 0.75), 0 0 36px rgba(234, 88, 12, 0.45), inset 0 1px 2px rgba(254, 243, 199, 0.65);
          border-color: #fef08a;
        }
        50% {
          transform: scale(1.045);
          background: linear-gradient(135deg, #fbbf24 0%, #f97316 50%, #d97706 100%);
          box-shadow: 0 0 28px rgba(251, 191, 36, 0.95), 0 0 54px rgba(234, 88, 12, 0.7), inset 0 1px 4px rgba(255, 251, 235, 0.9);
          border-color: #ffffff;
        }
      }
      @keyframes chai-steam-drift {
        0%, 100% {
          transform: scale(1) translate3d(0px, 0px, 0px);
          opacity: 0.78;
        }
        50% {
          transform: scale(1.06) translate3d(0px, -6px, 0px);
          opacity: 0.96;
        }
      }
      .animate-chai-hud-pulse {
        animation: chai-hud-pulse 0.85s ease-in-out infinite;
      }
      .animate-chai-steam-edge {
        animation: chai-steam-drift 1.6s ease-in-out infinite;
      }
    </style>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
